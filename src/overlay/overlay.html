<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scoreboard Output</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders:opsz,wght@10..72,400..800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./overlay.css" />
  </head>
  <body data-scene="scoreboard">
    <!-- Static, not rendered by React: autoplay needs the `muted` attribute in the markup. -->
    <video class="bg-video" autoplay muted loop playsinline>
      <source src="/media/SemaforBG.mp4" type="video/mp4" />
    </video>

    <!-- Background image and one section per scene, rendered by Overlay.tsx. -->
    <div id="root"></div>

    <script type="module" src="./main.tsx"></script>
  </body>
</html>
